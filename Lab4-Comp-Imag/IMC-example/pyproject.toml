# =============================================================================
# IMC sub-environment for BMED365-2027 Lab4-Comp-Imag/IMC-example (managed with uv)
# =============================================================================
# Setup:
#   cd Lab4-Comp-Imag/IMC-example
#   uv sync
#   uv run python -m ipykernel install --user --name bmed365imc --display-name "BMED365IMC"
#   uv run jupyter lab
# =============================================================================

[project]
name = "bmed365imc"
version = "2027.0.0"
description = "Imaging Mass Cytometry (steinbock / readimc / napari) environment for BMED365 Lab 4"
requires-python = ">=3.11,<3.12"

dependencies = [
    "ipython>=8.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.0.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "gdown>=4.7.0",
    "readimc>=0.6.0",
    "steinbock>=0.16.0",
    "napari[all]>=0.4.18",
    "napari-imc>=0.6.0",
    "nibabel>=5.1.0",
    "scikit-learn>=1.3.0",
    "scikit-image>=0.21.0",
    "tifffile>=2023.7.10",
]

[tool.uv]
package = false

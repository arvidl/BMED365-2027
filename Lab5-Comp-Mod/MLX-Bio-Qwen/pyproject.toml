# =============================================================================
# MLX-Bio sub-environment for BMED365-2027 Lab5-Comp-Mod/MLX-Bio-Qwen (managed with uv)
# =============================================================================
# Apple Silicon local LLM environment (Qwen 2.5 via mlx-lm + LoRA fine-tuning).
#
# Setup (macOS Apple Silicon):
#   cd Lab5-Comp-Mod/MLX-Bio-Qwen
#   uv sync
#   uv run python -m ipykernel install --user --name mlx-bio --display-name "Python (BMED365 - MLX Bio)"
#   uv run jupyter lab
# =============================================================================

[project]
name = "mlx-bio"
version = "2027.0.0"
description = "Apple Silicon MLX + Computational Biology environment for BMED365 Lab 5"
requires-python = ">=3.11,<3.13"

dependencies = [
    "jupyterlab>=4.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "biopython>=1.81",
    "scanpy>=1.9.8",
    "anndata>=0.10.0",
    "huggingface-hub>=0.23.0",
    "mlx>=0.18.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm[train]>=0.19.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false
